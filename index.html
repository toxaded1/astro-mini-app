<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астро-Прогноз</title>
    <!-- Обязательный скрипт для связи с Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #050510;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid #0f3460;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.1);
            text-align: center;
            margin-top: 20px;
        }
        h1 {
            font-size: 24px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
            margin-bottom: 10px;
        }
        .zodiac-icon {
            font-size: 50px;
            margin: 10px 0;
        }
        p.text {
            font-size: 15px;
            line-height: 1.5;
            color: #d1d1e9;
        }
        .btn {
            background: linear-gradient(90deg, #e94560, #ff2e63);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="zodiac-icon">♓️</div>
        <h1>Твой прогноз, Рыбы</h1>
        <p class="text">Сегодня звезды сулят неожиданные сдвиги. Прислушайся к интуиции — она приведет тебя к правильному решению, а энергия космоса будет на твоей стороне.</p>
        <!-- Кнопка для будущей монетизации -->
        <button class="btn" onclick="Telegram.WebApp.showAlert('Скоро здесь будет оплата через Telegram Stars!')">Узнать совместимость 🔮</button>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран телефона
        tg.setHeaderColor('#050510'); // Красим верхнюю шапку в цвет фона
    </script>
</body>
</html>
