<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07090E">
<title>Lumina — астрология, таро, совместимость</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #07090E; --paper: #10141D; --paper-2: #151A26; --paper-active: #1A2030;
  --text-main: #E7ECF3; --text-muted: #8A93A6; --text-dim: #5A6378;
  --gold: #D8B258; --gold-2: #F0D48C; --gold-dim: rgba(216,178,88,.12);
  --line: rgba(255,255,255,.06); --line-strong: rgba(216,178,88,.3);
  --good: #4ADE9B; --bad: #FF6B6B; --mid: #8FB8FF;
  --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--text-main); font-family: var(--sans); font-size: 15px; line-height: 1.5; padding-bottom: calc(86px + var(--safe-b)); overflow-x: hidden; min-height: 100vh; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; z-index: -2; background: radial-gradient(ellipse at 50% -10%, rgba(216,178,88,.13) 0%, transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(80,90,160,.08) 0%, transparent 50%); }
#stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .55; }
button { font-family: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
b, strong { color: #fff; font-weight: 600; }

h1, h2, h3 { font-family: var(--serif); font-weight: 600; color: #fff; }
.page-title { font-size: 34px; line-height: 1.1; letter-spacing: .01em; }
.page-subtitle { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 17px; margin: 4px 0 22px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); font-weight: 600; }
.muted { color: var(--text-muted); } .dim { color: var(--text-dim); }
.serif { font-family: var(--serif); }
.gold { color: var(--gold); }
.small { font-size: 13px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; }

.screen { display: none; padding: 22px 18px 10px; max-width: 560px; margin: 0 auto; animation: fade .35s ease; }
.screen.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; position: relative; overflow: hidden; }
.card::after { content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, rgba(216,178,88,.35), transparent); }
.card-title { font-family: var(--serif); font-size: 22px; color: #fff; margin-bottom: 4px; line-height: 1.2; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 14px; padding: 14px 18px; font-weight: 600; font-size: 15px; transition: transform .15s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(135deg, var(--gold-2), var(--gold) 45%, #B88D33); color: #1A1305; width: 100%; box-shadow: 0 6px 24px rgba(216,178,88,.18); }
.btn-ghost { background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--text-main); }
.btn-link { background: none; border: none; color: var(--gold); font-size: 13px; font-weight: 600; padding: 4px 0; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

.chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.05); border: 1px solid var(--line); padding: 5px 11px; border-radius: 99px; font-size: 12px; color: var(--text-main); white-space: nowrap; }
.chip.gold { color: var(--gold); border-color: rgba(216,178,88,.25); background: var(--gold-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
.input, .select { width: 100%; background: rgba(0,0,0,.35); border: 1px solid var(--line); color: #fff; padding: 13px 14px; border-radius: 12px; font-size: 16px; outline: none; transition: border-color .2s; -webkit-appearance: none; appearance: none; color-scheme: dark; }
.input:focus, .select:focus { border-color: var(--line-strong); }
.select { background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-muted); margin: -4px 0 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--gold); }

.seg { display: flex; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 16px; }
.seg button { flex: 1; background: none; border: none; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text-muted); transition: all .2s; }
.seg button.on { background: var(--paper-active); color: var(--gold); box-shadow: 0 2px 10px rgba(0,0,0,.3); }

/* ── HOME ── */
.greet { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.date-line { font-size: 13px; color: var(--text-muted); text-transform: capitalize; margin-top: 4px; }
.avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--gold-dim); border: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--gold); flex-shrink: 0; }
.moon-hero { display: flex; gap: 16px; align-items: center; }
.moon-hero svg { flex-shrink: 0; filter: drop-shadow(0 0 22px rgba(240,212,140,.25)); }
.moon-name { font-family: var(--serif); font-size: 26px; color: #fff; line-height: 1.1; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stat { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat-v { font-family: var(--serif); font-size: 19px; color: var(--gold); line-height: 1.2; }
.stat-l { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
.vibe-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.vibe-title { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; font-weight: 600; }
.vibe-text { font-family: var(--serif); font-size: 17px; color: #fff; line-height: 1.25; }
.headline { font-family: var(--serif); font-size: 25px; color: var(--gold); line-height: 1.2; margin: 6px 0 14px; }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 4px; }
.bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; color: var(--text-muted); font-weight: 500; }
.bar-label span:last-child { color: #fff; }
.bar-track { height: 5px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #B88D33, var(--gold-2)); border-radius: 4px; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
.transit { padding: 12px 0; border-top: 1px solid var(--line); }
.transit:first-of-type { border-top: none; }
.transit-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: #fff; }
.transit-h .badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .05em; }
.badge.good { background: rgba(74,222,155,.12); color: var(--good); }
.badge.bad { background: rgba(255,107,107,.12); color: var(--bad); }
.badge.mid { background: rgba(143,184,255,.12); color: var(--mid); }
.transit p { font-size: 14px; color: var(--text-muted); line-height: 1.55; }
.planet-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.planet-row:first-child { border-top: none; }
.pglyph { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.04); display: flex; align-items: center; justify-content: center; font-size: 17px; color: var(--gold); flex-shrink: 0; }
.planet-row .pname { flex: 1; font-size: 14px; }
.planet-row .ppos { font-size: 13px; color: var(--text-muted); text-align: right; }
.retro { color: var(--bad); font-weight: 700; font-size: 11px; margin-left: 4px; }

/* мини-карта дня */
.daycard { display: flex; gap: 16px; align-items: center; }
.daycard .tcard { width: 92px; flex-shrink: 0; }

/* ── LUNAR CALENDAR ── */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-nav { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 16px; color: var(--gold); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { font-size: 10px; color: var(--text-dim); text-align: center; text-transform: uppercase; padding-bottom: 4px; }
.cal-day { aspect-ratio: 1 / 1.15; background: rgba(0,0,0,.2); border: 1px solid transparent; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; padding: 2px; }
.cal-day .e { font-size: 15px; line-height: 1; }
.cal-day .z { font-size: 10px; color: var(--text-dim); }
.cal-day.today { border-color: var(--gold); }
.cal-day.sel { background: var(--gold-dim); border-color: var(--line-strong); }
.cal-day.empty { background: none; }
.cal-detail { margin-top: 12px; background: rgba(0,0,0,.25); border-radius: 14px; padding: 14px; border: 1px solid var(--line); }

/* ── SIGNS ── */
.sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sign-tile { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px 6px 12px; text-align: center; transition: transform .15s, border-color .2s; position: relative; }
.sign-tile:active { transform: scale(.96); }
.sign-tile.mine { border-color: var(--line-strong); background: linear-gradient(180deg, var(--gold-dim), var(--paper)); }
.sign-tile .g { font-size: 28px; color: var(--gold); line-height: 1.2; }
.sign-tile .n { font-family: var(--serif); font-size: 18px; color: #fff; font-weight: 600; }
.sign-tile .d { font-size: 10.5px; color: var(--text-muted); }
.sign-tile .el { position: absolute; top: 8px; right: 9px; width: 6px; height: 6px; border-radius: 50%; }
.big-glyph { width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle, rgba(216,178,88,.2), transparent 70%); border: 1px solid var(--line-strong); display: flex; align-items: center; justify-content: center; font-size: 38px; color: var(--gold); margin: 0 auto 10px; }
.section-t { font-family: var(--serif); font-size: 19px; color: #fff; margin: 18px 0 6px; display: flex; align-items: center; gap: 8px; }
.prose { font-size: 14.5px; color: var(--text-muted); line-height: 1.65; }
.prose p + p { margin-top: 10px; }
.talismans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.talisman { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.talisman .l { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
.talisman .v { font-size: 14px; color: #fff; margin-top: 2px; }

/* ── SHEET ── */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: opacity .3s; }
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; background: #0C1018; border-top: 1px solid var(--line-strong); border-radius: 24px 24px 0 0; z-index: 201; transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.8,.2,1); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 18px calc(28px + var(--safe-b)); max-width: 560px; margin: 0 auto; }
.sheet.open { transform: none; }
.sheet-grab { width: 40px; height: 4px; background: rgba(255,255,255,.15); border-radius: 4px; margin: 0 auto 10px; }
.sheet-close { position: sticky; top: 0; float: right; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.07); border: none; color: var(--text-muted); font-size: 16px; z-index: 2; }

/* ── TAROT ── */
.spread-list { display: flex; gap: 8px; overflow-x: auto; padding: 2px 18px 4px; margin: 0 -18px 14px; scrollbar-width: none; }
.spread-list::-webkit-scrollbar { display: none; }
.spread-btn { flex-shrink: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 108px; text-align: left; transition: all .2s; }
.spread-btn .i { font-size: 18px; color: var(--gold); }
.spread-btn .t { font-size: 13px; font-weight: 600; }
.spread-btn .c { font-size: 11px; color: var(--text-dim); }
.spread-btn.on { border-color: var(--gold); background: var(--gold-dim); }
.table { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0 6px; perspective: 1000px; }
.table.celtic { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px; }
.table.n1 .slot { width: 150px; }
.table.n4 .slot, .table.n5 .slot { width: 30%; max-width: 104px; }
.table.celtic .slot { width: auto; }
.slot-label { font-size: 10.5px; color: var(--text-muted); text-align: center; line-height: 1.2; min-height: 26px; }
.tcard { width: 100%; aspect-ratio: 0.58; position: relative; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,.7,.2,1); cursor: pointer; }
.tcard.flipped { transform: rotateY(180deg); }
.tcard .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; overflow: hidden; }
.tcard .back { background: radial-gradient(circle at 50% 50%, #2A2140 0%, #121022 70%); border: 1px solid rgba(216,178,88,.45); display: flex; align-items: center; justify-content: center; }
.tcard .back::before { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(216,178,88,.25); border-radius: 7px; background-image: repeating-linear-gradient(45deg, rgba(216,178,88,.06) 0 2px, transparent 2px 9px), repeating-linear-gradient(-45deg, rgba(216,178,88,.06) 0 2px, transparent 2px 9px); }
.tcard .back span { position: relative; font-size: 26px; color: var(--gold); text-shadow: 0 0 14px rgba(216,178,88,.6); }
.tcard .front { transform: rotateY(180deg); background: linear-gradient(170deg, #1E1A2E 0%, #121522 100%); border: 1px solid var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8% 6%; }
.tcard .front.rev .inner { transform: rotate(180deg); }
.tcard .front .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 9% 6%; }
.tcard .num { font-family: var(--serif); color: var(--gold); font-size: clamp(12px, 3.4vw, 17px); font-weight: 700; letter-spacing: .05em; }
.tcard .sym { color: var(--gold-2); font-size: clamp(26px, 9vw, 52px); line-height: 1; text-shadow: 0 0 18px rgba(240,212,140,.4); }
.tcard .sym svg { width: clamp(30px, 10vw, 54px); height: clamp(30px, 10vw, 54px); stroke: var(--gold-2); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 8px rgba(240,212,140,.35)); }
.tcard .cname { font-family: var(--serif); color: #fff; font-size: clamp(10px, 2.9vw, 14px); text-align: center; line-height: 1.1; font-weight: 600; }
.table.celtic .tcard .cname { font-size: 9px; }
.table.celtic .tcard .sym { font-size: 22px; }
.table.celtic .tcard .sym svg { width: 24px; height: 24px; }
.table.celtic .slot-label { font-size: 9.5px; min-height: 24px; }
.reading-item { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); animation: fade .4s ease; }
.reading-item:first-child { border-top: none; }
.reading-item .ri-n { width: 26px; height: 26px; border-radius: 50%; background: var(--gold-dim); color: var(--gold); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ri-pos { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
.ri-name { font-family: var(--serif); font-size: 19px; color: #fff; line-height: 1.2; }
.ri-text { font-size: 14px; color: var(--text-muted); margin-top: 3px; line-height: 1.55; }
.verdict { text-align: center; font-family: var(--serif); font-size: 40px; color: var(--gold); line-height: 1; margin: 6px 0; }
.textarea { width: 100%; min-height: 64px; resize: none; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 12px; color: #fff; padding: 12px 14px; font-size: 15px; outline: none; }
.hist-item { padding: 12px 0; border-top: 1px solid var(--line); }
.hist-item:first-child { border-top: none; }
.deck-search { margin-bottom: 12px; }
.deck-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.deck-grid .tcard { cursor: pointer; }

/* ── MATCH ── */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; margin-bottom: 16px; }
.vs-x { font-family: var(--serif); color: var(--gold); font-size: 22px; padding-bottom: 12px; }
.ring-wrap { display: flex; flex-direction: column; align-items: center; margin: 6px 0 16px; }
.ring-wrap svg { overflow: visible; }
.ring-val { font-family: var(--serif); font-size: 40px; fill: #fff; font-weight: 600; }
.ring-sub { font-size: 10px; fill: var(--text-muted); letter-spacing: .1em; text-transform: uppercase; }
.match-title { font-family: var(--serif); font-size: 24px; color: var(--gold); text-align: center; line-height: 1.2; }
.bars-1 { display: flex; flex-direction: column; gap: 12px; margin: 14px 0; }
.syn-asp { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.syn-asp:first-child { border-top: none; }
.syn-asp .g { font-size: 15px; color: var(--gold); width: 64px; flex-shrink: 0; letter-spacing: .05em; }

/* ── ME / NATAL ── */
.big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
.b3 { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
.b3 .g { font-size: 22px; color: var(--gold); }
.b3 .v { font-family: var(--serif); font-size: 17px; color: #fff; line-height: 1.15; }
.b3 .l { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
.wheel-wrap { display: flex; justify-content: center; margin: 4px -6px; }
.wheel-wrap svg { width: 100%; max-width: 380px; height: auto; }
.acc { border-top: 1px solid var(--line); }
.acc:first-child { border-top: none; }
.acc-h { display: flex; align-items: center; gap: 12px; padding: 11px 0; cursor: pointer; }
.acc-h .t { flex: 1; font-size: 14px; }
.acc-h .s { font-size: 12.5px; color: var(--text-muted); text-align: right; }
.acc-h .arr { color: var(--text-dim); transition: transform .25s; font-size: 12px; }
.acc.open .arr { transform: rotate(90deg); color: var(--gold); }
.acc-b { display: none; font-size: 14px; color: var(--text-muted); padding: 0 0 12px 46px; line-height: 1.6; }
.acc.open .acc-b { display: block; animation: fade .3s ease; }
.balance { display: flex; flex-direction: column; gap: 10px; }
.num-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.num-cell { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
.num-cell .v { font-family: var(--serif); font-size: 34px; color: var(--gold); line-height: 1; }
.num-cell .l { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.num-cell .t { font-size: 13px; color: #fff; font-weight: 600; }
.notice { font-size: 12.5px; color: var(--text-muted); background: rgba(143,184,255,.06); border: 1px solid rgba(143,184,255,.15); border-radius: 12px; padding: 10px 12px; line-height: 1.5; }
.empty-state { text-align: center; padding: 10px 6px; }
.empty-state .g { font-size: 40px; margin-bottom: 8px; }

/* ── NAV ── */

<script>
// ═══════════════ АСТРО-ДВИЖОК ═══════════════
// Позиции планет по методу P. Schlyter (точность ~1–2′ для Солнца/Луны, ~1° для планет),
// тропический зодиак, эпоха даты. Асцендент/MC — через звёздное время.
const Astro = (() => {
  const RAD = Math.PI / 180, DEG = 180 / Math.PI;
  const norm = a => ((a % 360) + 360) % 360;
  const sind = a => Math.sin(a * RAD), cosd = a => Math.cos(a * RAD);
  const atan2d = (y, x) => Math.atan2(y, x) * DEG;
  const jd = date => date.getTime() / 86400000 + 2440587.5;
  const dnum = j => j - 2451543.5;

  const ELEM = {
    mercury: d => ({ N: 48.3313 + 3.24587e-5 * d, i: 7.0047 + 5.0e-8 * d, w: 29.1241 + 1.01444e-5 * d, a: 0.387098, e: 0.205635 + 5.59e-10 * d, M: 168.6562 + 4.0923344368 * d }),
    venus:   d => ({ N: 76.6799 + 2.4659e-5 * d, i: 3.3946 + 2.75e-8 * d, w: 54.891 + 1.38374e-5 * d, a: 0.72333, e: 0.006773 - 1.302e-9 * d, M: 48.0052 + 1.6021302244 * d }),
    mars:    d => ({ N: 49.5574 + 2.11081e-5 * d, i: 1.8497 - 1.78e-8 * d, w: 286.5016 + 2.92961e-5 * d, a: 1.523688, e: 0.093405 + 2.516e-9 * d, M: 18.6021 + 0.5240207766 * d }),
    jupiter: d => ({ N: 100.4542 + 2.76854e-5 * d, i: 1.303 - 1.557e-7 * d, w: 273.8777 + 1.64505e-5 * d, a: 5.20256, e: 0.048498 + 4.469e-9 * d, M: 19.895 + 0.0830853001 * d }),
    saturn:  d => ({ N: 113.6634 + 2.3898e-5 * d, i: 2.4886 - 1.081e-7 * d, w: 339.3939 + 2.97661e-5 * d, a: 9.55475, e: 0.055546 - 9.499e-9 * d, M: 316.967 + 0.0334442282 * d }),
    uranus:  d => ({ N: 74.0005 + 1.3978e-5 * d, i: 0.7733 + 1.9e-8 * d, w: 96.6612 + 3.0565e-5 * d, a: 19.18171 - 1.55e-8 * d, e: 0.047318 + 7.45e-9 * d, M: 142.5905 + 0.011725806 * d }),
    neptune: d => ({ N: 131.7806 + 3.0173e-5 * d, i: 1.77 - 2.55e-7 * d, w: 272.8461 - 6.027e-6 * d, a: 30.05826 + 3.313e-8 * d, e: 0.008606 + 2.15e-9 * d, M: 260.2471 + 0.005995147 * d }),
  };

  function kepler(Mdeg, e) {
    const M = norm(Mdeg) * RAD;
    let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));
    for (let k = 0; k < 15; k++) {
      const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      E -= dE;
      if (Math.abs(dE) < 1e-10) break;
    }
    return E;
  }

  function orbit(el) {
    const E = kepler(el.M, el.e);
    const xv = el.a * (Math.cos(E) - el.e), yv = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
    const v = atan2d(yv, xv), r = Math.hypot(xv, yv), vw = v + el.w;
    const x = r * (cosd(el.N) * cosd(vw) - sind(el.N) * sind(vw) * cosd(el.i));
    const y = r * (sind(el.N) * cosd(vw) + cosd(el.N) * sind(vw) * cosd(el.i));
    const z = r * sind(vw) * sind(el.i);
    return { lon: norm(atan2d(y, x)), lat: atan2d(z, Math.hypot(x, y)), r };
  }

  function sunAt(d) {
    const w = 282.9404 + 4.70935e-5 * d, e = 0.016709 - 1.151e-9 * d, M = 356.047 + 0.9856002585 * d;
    const E = kepler(M, e);
    const xv = Math.cos(E) - e, yv = Math.sqrt(1 - e * e) * Math.sin(E);
    return { lon: norm(atan2d(yv, xv) + w), r: Math.hypot(xv, yv), M: norm(M), w };
  }

  function moonAt(d, s) {
    const N = 125.1228 - 0.0529538083 * d, w = 318.0634 + 0.1643573223 * d, M = 115.3654 + 13.0649929509 * d;
    const o = orbit({ N, i: 5.1454, w, a: 60.2666, e: 0.0549, M });
    const Ms = s.M, Mm = norm(M), Ls = norm(s.M + s.w), Lm = norm(M + w + N), D = Lm - Ls, F = Lm - N;
    const lon = o.lon
      - 1.274 * sind(Mm - 2 * D) + 0.658 * sind(2 * D) - 0.186 * sind(Ms)
      - 0.059 * sind(2 * Mm - 2 * D) - 0.057 * sind(Mm - 2 * D + Ms) + 0.053 * sind(Mm + 2 * D)
      + 0.046 * sind(2 * D - Ms) + 0.041 * sind(Mm - Ms) - 0.035 * sind(D)
      - 0.031 * sind(Mm + Ms) - 0.015 * sind(2 * F - 2 * D) + 0.011 * sind(Mm - 4 * D);
    return norm(lon);
  }

  function planetGeo(name, d, s) {
    const o = orbit(ELEM[name](d));
    let lon = o.lon;
    if (name === 'jupiter' || name === 'saturn' || name === 'uranus') {
      const Mj = norm(ELEM.jupiter(d).M), Ms = norm(ELEM.saturn(d).M), Mu = norm(ELEM.uranus(d).M);
      if (name === 'jupiter') lon += -0.332 * sind(2 * Mj - 5 * Ms - 67.6) - 0.056 * sind(2 * Mj - 2 * Ms + 21) + 0.042 * sind(3 * Mj - 5 * Ms + 21) - 0.036 * sind(Mj - 2 * Ms) + 0.022 * cosd(Mj - Ms) + 0.023 * sind(2 * Mj - 3 * Ms + 52) - 0.016 * sind(Mj - 5 * Ms - 69);
      if (name === 'saturn') lon += 0.812 * sind(2 * Mj - 5 * Ms - 67.6) - 0.229 * cosd(2 * Mj - 4 * Ms - 2) + 0.119 * sind(Mj - 2 * Ms - 3) + 0.046 * sind(2 * Mj - 6 * Ms - 69) + 0.014 * sind(Mj - 3 * Ms + 32);
      if (name === 'uranus') lon += 0.04 * sind(Ms - 2 * Mu + 6) + 0.035 * sind(Ms - 3 * Mu + 33) - 0.015 * sind(Mj - Mu + 20);
    }
    const x = o.r * cosd(o.lat) * cosd(lon) + s.r * cosd(s.lon);
    const y = o.r * cosd(o.lat) * sind(lon) + s.r * sind(s.lon);
    return norm(atan2d(y, x));
  }

  const PLANET_KEYS = ['sun', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];

  function rawPositions(d) {
    const s = sunAt(d);
    const out = { sun: s.lon, moon: moonAt(d, s) };
    for (const k of ['mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune']) out[k] = planetGeo(k, d, s);
    return out;
  }

  // Позиции на момент date (+ флаг ретроградности)
  function positions(date) {
    const d = dnum(jd(date));
    const p = rawPositions(d), p2 = rawPositions(d + 0.5), p1 = rawPositions(d - 0.5);
    const res = {};
    for (const k of PLANET_KEYS) {
      let speed = p2[k] - p1[k];
      if (speed > 180) speed -= 360; if (speed < -180) speed += 360;
      res[k] = { lon: p[k], speed, retro: speed < 0 && k !== 'sun' && k !== 'moon' };
    }
    return res;
  }

  function angles(date, lat, lonE) {
    const j = jd(date), d = dnum(j), T = (j - 2451545) / 36525;
    const gmst = 280.46061837 + 360.98564736629 * (j - 2451545) + 0.000387933 * T * T;
    const lst = norm(gmst + lonE), eps = 23.4393 - 3.563e-7 * d;
    const mc = norm(atan2d(sind(lst), cosd(lst) * cosd(eps)));
    const asc = norm(atan2d(cosd(lst), -(sind(lst) * cosd(eps) + Math.tan(lat * RAD) * sind(eps))));
    return { asc, mc };
  }

  const moonElong = date => {
    const d = dnum(jd(date)); const s = sunAt(d);
    return norm(moonAt(d, s) - s.lon);
  };

  function moonInfo(date) {
    const d = dnum(jd(date)); const s = sunAt(d); const m = moonAt(d, s);
    const el = norm(m - s.lon);
    const illum = (1 - cosd(el)) / 2;
    const phase = Math.floor((el + 22.5) / 45) % 8;
    const age = el / 360 * 29.530589;
    return { lon: m, elong: el, illum, phase, age, lunarDay: Math.floor(age) + 1, sign: Math.floor(m / 30) };
  }

  // Ближайший момент, когда элонгация Луны = target (0 новолуние, 180 полнолуние)
  function nextPhase(from, target) {
    const H = 3600000;
    const f = t => { let v = norm(moonElong(new Date(t)) - target); return v > 180 ? v - 360 : v; };
    let t = from.getTime(), prev = f(t);
    for (let i = 0; i < 24 * 32; i += 6) {
      const t2 = t + 6 * H, cur = f(t2);
      if (prev < 0 && cur >= 0) {
        let a = t, b = t2;
        for (let k = 0; k < 30; k++) { const m = (a + b) / 2; if (f(m) < 0) a = m; else b = m; }
        return new Date(b);
      }
      t = t2; prev = cur;
    }
    return null;
  }

  // Когда Луна сменит знак
  function nextMoonIngress(from) {
    const H = 3600000; const sign0 = Math.floor(moonInfo(from).lon / 30);
    let t = from.getTime();
    for (let i = 0; i < 80; i++) {
      const t2 = t + H;
      if (Math.floor(moonInfo(new Date(t2)).lon / 30) !== sign0) {
        let a = t, b = t2;
        for (let k = 0; k < 20; k++) { const m = (a + b) / 2; if (Math.floor(moonInfo(new Date(m)).lon / 30) === sign0) a = m; else b = m; }
        return { date: new Date(b), sign: (sign0 + 1) % 12 };
      }
      t = t2;
    }
    return null;
  }

  // Натальная карта
  function chart({ date, time, timeKnown, tz, lat, lon }) {
    const [y, m, dd] = date.split('-').map(Number);
    const [hh, mi] = (timeKnown && time ? time : '12:00').split(':').map(Number);
    const utc = new Date(Date.UTC(y, m - 1, dd, hh, mi) - (tz || 0) * 3600000);
    const pos = positions(utc);
    const res = { utc, planets: pos, timeKnown: !!timeKnown };
    if (timeKnown && lat != null && lon != null) {
      const a = angles(utc, lat, lon);
      res.asc = a.asc; res.mc = a.mc;
    }
    return res;
  }

  const ASPECTS = [
    { key: 'conj', angle: 0, name: 'Соединение', glyph: '☌', nature: 0 },
    { key: 'sext', angle: 60, name: 'Секстиль', glyph: '⚹', nature: 1 },
    { key: 'square', angle: 90, name: 'Квадратура', glyph: '□', nature: -1 },
    { key: 'trine', angle: 120, name: 'Трин', glyph: '△', nature: 1 },
    { key: 'opp', angle: 180, name: 'Оппозиция', glyph: '☍', nature: -1 },
  ];

  function aspectBetween(a, b, orb) {
    let diff = Math.abs(norm(a - b)); if (diff > 180) diff = 360 - diff;
    for (const asp of ASPECTS) {
      const o = Math.abs(diff - asp.angle);
      if (o <= orb) return { ...asp, orb: o, tight: 1 - o / orb };
    }
    return null;
  }

  const fmtDeg = lon => {
    const inSign = lon % 30; const dg = Math.floor(inSign); const mn = Math.floor((inSign - dg) * 60);
    return `${dg}°${String(mn).padStart(2, '0')}′`;
  };

  return { positions, angles, moonInfo, nextPhase, nextMoonIngress, chart, aspectBetween, ASPECTS, PLANET_KEYS, norm, fmtDeg, jd };
})();

  function dailyReading(date = new Date()) {
    const now = Astro.positions(date), N = NATAL;
    const targets = { sun: N.planets.sun.lon, moon: N.planets.moon.lon, mercury: N.planets.mercury.lon, venus: N.planets.venus.lon, mars: N.planets.mars.lon };
    if (N.asc != null) targets.asc = N.asc;
    const orbs = { moon: 5, sun: 3, mercury: 3, venus: 3, mars: 3, jupiter: 2.5, saturn: 2.5 };
    const wt = { moon: .75, sun: 1, mercury: .85, venus: 1, mars: 1, jupiter: 1.2, saturn: 1.2 };
    const list = [];
    for (const t of Object.keys(TRANSIT)) for (const n of Object.keys(targets)) {
      if (t === 'sun' && n === 'sun') continue;
      const a = Astro.aspectBetween(now[t].lon, targets[n], orbs[t]);
      if (a) list.push({ t, n, a, w: wt[t] * (0.5 + a.tight) * (n === 'sun' || n === 'asc' ? 1.15 : 1) });
    }
    list.sort((x, y) => y.w - x.w);
    const R = seedRng(dateKey(date) + profile.name + profile.date);
    const sc = { love: 56 + R() * 14, work: 56 + R() * 14, energy: 56 + R() * 14, luck: 56 + R() * 14 };
    for (const x of list) {
      const sgn = x.a.nature === 0 ? (['saturn', 'mars'].includes(x.t) ? -0.3 : 0.7) : x.a.nature;
      for (const c in CAT) if (CAT[c].includes(x.t) || CAT[c].includes(x.n)) sc[c] += sgn * 13 * (0.4 + x.a.tight);
    }
    for (const c in sc) sc[c] = Math.round(clamp(sc[c], 18, 98));
    const base = N.asc != null ? signOf(N.asc) : signOf(N.planets.sun.lon);
    const moonSign = signOf(now.moon.lon);
    const house = ((moonSign - base + 12) % 12) + 1;
    const top = list[0];
    let headline = HOUSES[house - 1].t;
    if (top) {
      const good = top.a.nature > 0 || (top.a.nature === 0 && !['saturn', 'mars'].includes(top.t));
      headline = (good ? HEAD_GOOD : HEAD_HARD)[top.t];
    }
    const items = list.slice(0, 4).map(x => {
      const good = x.a.nature > 0 || (x.a.nature === 0 && !['saturn', 'mars'].includes(x.t));
      const badge = x.a.nature === 0 ? ['mid', 'соединение'] : good ? ['good', 'гармония'] : ['bad', 'напряжение'];
      return {
        title: `${PLANETS[x.t].g} ${PLANETS[x.t].name} ${x.a.glyph} ${NAT_NOM[x.n]}`, badge,
        text: `${TRANSIT[x.t].does} — это затрагивает ${NATAL_AREA[x.n]}. ${ASPECT_DESC[x.a.key]} ${good ? TRANSIT[x.t].good : TRANSIT[x.t].hard}`,
      };
    });
    const pday = numerology().pday;
    return { now, sc, house, moonSign, headline, items, retro: retroNotes(now), pday };
  }

  function signForecast(si, date = new Date()) {
    const now = Astro.positions(date);
    const houseOf = k => ((signOf(now[k].lon) - si + 12) % 12) + 1;
    const mh = houseOf('moon'), sh = houseOf('sun'), vh = houseOf('venus'), mah = houseOf('mars');
    const R = seedRng(dateKey(date) + 'sign' + si);
    const sc = { love: 55 + R() * 16, work: 55 + R() * 16, energy: 55 + R() * 16, luck: 55 + R() * 16 };
    for (const t of Object.keys(TRANSIT)) {
      const d0 = Math.abs(signOf(now[t].lon) - si), d = Math.min(d0, 12 - d0);
      const nat = d === 0 ? 0.5 : (d === 2 || d === 4) ? 1 : (d === 3 || d === 6) ? -1 : 0;
      const w = t === 'moon' ? 9 : 6;
      for (const c in CAT) if (CAT[c].includes(t)) sc[c] += nat * w;
    }
    for (const c in sc) sc[c] = Math.round(clamp(sc[c], 20, 97));
    const lc = s => s.toLowerCase();
    const parts = [
      `<b>Луна в ${mh}-м доме</b> от вашего знака (${lc(HOUSES[mh - 1].t)}): ${HOUSES[mh - 1].d}`,
      `<b>Солнце в ${sh}-м доме</b> — главная тема месяца: ${lc(HOUSES[sh - 1].t)}.`,
      `<b>Венера в ${vh}-м доме</b>: в любви и деньгах акцент на теме «${lc(HOUSES[vh - 1].t)}».`,
      `<b>Марс в ${mah}-м доме</b> направляет энергию в сферу «${lc(HOUSES[mah - 1].t)}».`,
      ...retroNotes(now),
    ];
    return { sc, parts };
  }

  // ════════════ НУМЕРОЛОГИЯ ════════════
  const NUM_MAP = {};
  ['АИСЪ', 'БЙТЫ', 'ВКУЬ', 'ГЛФЭ', 'ДМХЮ', 'ЕНЦЯ', 'ЁОЧ', 'ЖПШ', 'ЗРЩ'].forEach((s, i) => [...s].forEach(ch => NUM_MAP[ch] = i + 1));
  ['AJS', 'BKT', 'CLU', 'DMV', 'ENW', 'FOX', 'GPY', 'HQZ', 'IR'].forEach((s, i) => [...s].forEach(ch => NUM_MAP[ch] = i + 1));
  const VOWELS = 'АЕЁИОУЫЭЮЯAEIOU';
  const digitSum = n => String(n).split('').reduce((a, b) => a + (+b || 0), 0);
  const reduce = (n, master = true) => { while (n > 9 && !(master && (n === 11 || n === 22 || n === 33))) n = digitSum(n); return n; };
  function numerology(p = profile, today = new Date()) {
    if (!p) return {};
    const [y, m, d] = p.date.split('-').map(Number);
    const life = reduce(digitSum(y) + digitSum(m) + digitSum(d));
    const letters = [...(p.name || '').toUpperCase()].filter(ch => NUM_MAP[ch]);
    const destiny = letters.length ? reduce(letters.reduce((a, ch) => a + NUM_MAP[ch], 0)) : null;
    const soulL = letters.filter(ch => VOWELS.includes(ch)), persL = letters.filter(ch => !VOWELS.includes(ch));
    const soul = soulL.length ? reduce(soulL.reduce((a, ch) => a + NUM_MAP[ch], 0)) : null;
    const pers = persL.length ? reduce(persL.reduce((a, ch) => a + NUM_MAP[ch], 0)) : null;
    const pyear = reduce(digitSum(d) + digitSum(m) + digitSum(today.getFullYear()), false);
    const pmonth = reduce(pyear + digitSum(today.getMonth() + 1), false);
    const pday = reduce(pmonth + digitSum(today.getDate()), false);
    return { life, destiny, soul, pers, pyear, pmonth, pday };
  }

  // ════════════ КАРТА ТАРО (HTML) ════════════
  function cardHTML(card, rev = false, flipped = false, attrs = '') {
    const sym = card.major ? `<div class="sym">${card.symbol}</div>` : `<div class="sym"><svg viewBox="0 0 24 24">${SUITS[card.suitIdx].icon}</svg></div>`;
    return `<div class="tcard ${flipped ? 'flipped' : ''}" ${attrs}>
      <div class="face back"><span>✶</span></div>
      <div class="face front ${rev ? 'rev' : ''}"><div class="inner"><div class="num">${card.num}</div>${sym}<div class="cname">${esc(card.name)}</div></div></div></div>`;
  }
  const dayCardFor = date => {
    const R = seedRng('daycard' + dateKey(date) + (profile?.name || tgName) + (profile?.date || ''));
    return { id: Math.floor(R() * 78), rev: R() < 0.3 };
  };

  // ════════════ ЭКРАН «ЭФИР» ════════════
  let calMonth = new Date(); calMonth.setDate(1);
  let calSel = dateKey(new Date());

  function renderHome() {

    const name = profile?.name || tgName;
    const mi = Astro.moonInfo(now), ph = PHASES[mi.phase];
    const nf = Astro.nextPhase(now, 180), nn = Astro.nextPhase(now, 0), ing = Astro.nextMoonIngress(now);
    const md = MOON_DAY[mi.sign];
    let html = `
      <div class="greet">
        <div><h1 class="page-title">${hello}${name ? ',<br>' + esc(name) : ''}</h1>

      </div>

        <div class="moon-hero">${moonSVG(mi.elong, 84)}

          ${ing ? `<div class="dim small">→ ${SIGNS[ing.sign].in} с ${fmtTime(ing.date)}${dateKey(ing.date) !== dateKey(now) ? ', ' + fmtDate(ing.date) : ''}</div>` : ''}</div>
        </div>
        <div class="stat-grid">
          <div class="stat"><div class="stat-v">${Math.round(mi.illum * 100)}%</div><div class="stat-l">Освещённость</div></div>
          <div class="stat"><div class="stat-v">${mi.lunarDay}</div><div class="stat-l">Лунный день</div></div>
          <div class="stat"><div class="stat-v">${mi.elong < 180 ? '↑' : '↓'}</div><div class="stat-l">${mi.elong < 180 ? 'Растущая' : 'Убывающая'}</div></div>
        </div>
        <div class="stat-grid" style="grid-template-columns:1fr 1fr">
          <div class="stat"><div class="stat-v">🌕${T} ${nf ? fmtDate(nf) : '—'}</div><div class="stat-l">Полнолуние ${nf ? fmtTime(nf) : ''}</div></div>
          <div class="stat"><div class="stat-v">🌑${T} ${nn ? fmtDate(nn) : '—'}</div><div class="stat-l">Новолуние ${nn ? fmtTime(nn) : ''}</div></div>
        </div>
        <p class="prose mt12">${ph.advice}</p>

          <div><div class="vibe-title" style="color:var(--good)">Делать</div><div class="vibe-text">${md.do}</div></div>
          <div><div class="vibe-title" style="color:var(--bad)">Избегать</div><div class="vibe-text">${md.avoid}</div></div>
        </div>
        <div class="muted small mt12">Благоприятно: ${md.good}</div>
      </div>`;

    if (NATAL) {
      const r = dailyReading(now);
      html += `<div class="card" id="daily">
        <div class="eyebrow">Ваш прогноз на сегодня</div>
        <div class="headline">${r.headline}</div>
        <div class="bars">${bar('Любовь', r.sc.love)}${bar('Работа', r.sc.work)}${bar('Энергия', r.sc.energy)}${bar('Удача', r.sc.luck)}</div>
        <div class="divider"></div>
        ${r.items.length ? r.items.map(i => `<div class="transit"><div class="transit-h">${i.title} <span class="badge ${i.badge[0]}">${i.badge[1]}</span></div><p>${i.text}</p></div>`).join('')
          : `<p class="prose">Сегодня нет точных транзитов к вашей карте — спокойный день, когда всё зависит только от вас.</p>`}
        <div class="transit"><div class="transit-h">☽${T} Луна в вашем ${r.house}-м доме <span class="badge mid">${HOUSES[r.house - 1].t}</span></div><p>${HOUSES[r.house - 1].d}</p></div>
        ${r.retro.map(t => `<div class="transit"><p>${t}</p></div>`).join('')}
        <div class="transit"><div class="transit-h">Число дня: ${r.pday}</div><p>${PERSONAL_DAY[r.pday]}</p></div>
        <button class="btn btn-ghost mt8" style="width:100%" id="share-daily">Поделиться прогнозом</button>
      </div>`;
    } else {
      html += `<div class="card empty-state"><div class="g">✨</div><div class="card-title">Персональный прогноз</div>
        <p class="prose" style="margin:6px 0 14px">Укажите дату рождения — и прогноз будет строиться по реальным транзитам планет к вашей натальной карте.</p>
        <button class="btn btn-primary" data-go="me">Заполнить профиль</button></div>`;
    }

    const dc = dayCardFor(now), card = DECK[dc.id];
    const seen = store.get('lumina_daycard', '') === dateKey(now);
    html += `<div class="card"><div class="eyebrow" style="margin-bottom:10px">Карта дня</div>
      <div class="daycard">${cardHTML(card, dc.rev, seen, 'id="daycard"')}
      <div id="daycard-text">${seen ? dayCardText(card, dc.rev) : '<div class="card-title">Что скажут карты?</div><p class="muted small">Нажмите на карту, чтобы открыть её. Одна карта — на весь день.</p>'}</div></div></div>`;

    // планеты сейчас
    const pos = Astro.positions(now);
    html += `<div class="card"><div class="card-head"><div class="card-title">Небо сейчас</div><span class="dim small">${fmtTime(now)}</span></div>
      ${Astro.PLANET_KEYS.map(k => { const p = pos[k], s = SIGNS[signOf(p.lon)]; return `<div class="planet-row"><div class="pglyph">${PLANETS[k].g}</div><div class="pname">${PLANETS[k].name}${p.retro ? '<span class="retro">R</span>' : ''}</div><div class="ppos">${s.g} ${s.name} ${Astro.fmtDeg(p.lon)}</div></div>`; }).join('')}
      ${retroNotes(pos).length ? '' : '<p class="dim small mt8">Ни одна личная планета сейчас не ретроградна.</p>'}
    </div>`;

    html += `<div class="card" id="calendar"></div>`;
    $('#home').innerHTML = html;
    renderCalendar();
    animateBars($('#home'));

    const dcEl = $('#daycard');
    dcEl.addEventListener('click', () => {
      if (dcEl.classList.contains('flipped')) { openCardSheet(card, dc.rev); return; }
      haptic('medium'); dcEl.classList.add('flipped'); store.set('lumina_daycard', dateKey(now));
      setTimeout(() => { $('#daycard-text').innerHTML = dayCardText(card, dc.rev); }, 350);
    });
    $('#share-daily')?.addEventListener('click', () => {
      const r = dailyReading(now);
      share(`✨ Мой прогноз на ${fmtDate(now)}: «${r.headline}»\n❤ Любовь ${r.sc.love}% · 💼 Работа ${r.sc.work}% · ⚡ Энергия ${r.sc.energy}% · 🍀 Удача ${r.sc.luck}%\n🃏 Карта дня: ${card.name}${dc.rev ? ' (перевёрнутая)' : ''}`);
    });
  }
  function dayCardText(card, rev) {
    return `<div class="card-title">${esc(card.name)}${rev ? ' <span class="dim small">(перевёрнутая)</span>' : ''}</div><p class="muted small">${rev ? card.rev : card.up}</p><button class="btn-link mt8" data-card="${card.id}" data-rev="${rev ? 1 : 0}">Подробнее →</button>`;
  }

  function renderCalendar() {
    const el = $('#calendar'); if (!el) return;
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const days = new Date(y, m + 1, 0).getDate(), first = (new Date(y, m, 1).getDay() + 6) % 7;
    const today = dateKey(new Date());
    let cells = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < first; i++) cells += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= days; d++) {
      const info = dayMoon(new Date(y, m, d));
      const key = `${y}-${pad(m + 1)}-${pad(d)}`;
      cells += `<button class="cal-day ${key === today ? 'today' : ''} ${key === calSel ? 'sel' : ''}" data-day="${key}"><span>${d}</span><span class="e">${info.emoji}</span><span class="z">${SIGNS[info.sign].g}</span></button>`;
    }
    const title = calMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
    el.innerHTML = `<div class="cal-head"><button class="cal-nav" data-cal="-1">‹</button><div class="card-title" style="text-transform:capitalize;margin:0">Лунный календарь<div class="dim small serif" style="font-size:15px">${title}</div></div><button class="cal-nav" data-cal="1">›</button></div>
      <div class="cal-grid">${cells}</div><div class="cal-detail" id="cal-detail"></div>`;
    renderCalDetail();
  }
  function dayMoon(day) {
    const s = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, 0);
    const e = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 23, 59);
    const noon = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 12, 0);
    const a = Astro.moonInfo(s), b = Astro.moonInfo(e), n = Astro.moonInfo(noon);
    let event = null;
    if (a.elong > 300 && b.elong < 60) event = 'new';
    else if (a.elong < 180 && b.elong >= 180) event = 'full';
    const em = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
    let idx = n.phase;
    if (!event && idx === 0) idx = n.elong < 180 ? 1 : 7;
    if (!event && idx === 4) idx = n.elong < 180 ? 3 : 5;
    if (event) idx = event === 'new' ? 0 : 4;
    return { ...n, event, emoji: em[idx] + T, idx, signStart: a.sign, signEnd: b.sign, start: s };
  }
  function renderCalDetail() {
    const el = $('#cal-detail'); if (!el) return;
    const [y, m, d] = calSel.split('-').map(Number);
    const day = new Date(y, m - 1, d);
    if (day.getMonth() !== calMonth.getMonth()) { el.style.display = 'none'; return; }
    el.style.display = '';
    const info = dayMoon(day), ph = PHASES[info.idx], md = MOON_DAY[info.sign];
    let ingress = '';
    if (info.signStart !== info.signEnd) {
      const ing = Astro.nextMoonIngress(info.start);
      if (ing) ingress = `<div class="muted small">В ${fmtTime(ing.date)} Луна переходит ${SIGNS[ing.sign].in} ${SIGNS[ing.sign].g}</div>`;
    }
    const ev = info.event === 'new' ? Astro.nextPhase(info.start, 0) : info.event === 'full' ? Astro.nextPhase(info.start, 180) : null;
    el.innerHTML = `<div class="eyebrow">${fmtDate(day, { weekday: 'long', day: 'numeric', month: 'long' })}</div>
      <div class="card-title mt8">${info.emoji} ${info.event ? (info.event === 'new' ? 'Новолуние' : 'Полнолуние') + (ev ? ' в ' + fmtTime(ev) : '') : ph.name}</div>
      <div class="muted small">Луна ${SIGNS[info.sign].in} ${SIGNS[info.sign].g} · ${info.lunarDay}-й лунный день · ${Math.round(info.illum * 100)}%</div>${ingress}
      <p class="prose mt8">${ph.advice}</p>
      <div class="vibe-row"><div><div class="vibe-title" style="color:var(--good)">Делать</div><div class="vibe-text">${md.do}</div></div>
      <div><div class="vibe-title" style="color:var(--bad)">Избегать</div><div class="vibe-text">${md.avoid}</div></div></div>
      <div class="muted small mt8">Благоприятно: ${md.good}</div>`;
  }
  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-cal]');
    if (nav) { hapticSel(); calMonth.setMonth(calMonth.getMonth() + +nav.dataset.cal); renderCalendar(); return; }
    const day = e.target.closest('[data-day]');
    if (day) { hapticSel(); calSel = day.dataset.day; $$('.cal-day.sel').forEach(x => x.classList.remove('sel')); day.classList.add('sel'); renderCalDetail(); return; }
    const go = e.target.closest('[data-go]');
    if (go) { haptic(); closeSheet(); goTab(go.dataset.go); return; }
    const cb = e.target.closest('[data-card]');
    if (cb && !cb.closest('#tarot-table')) { haptic(); openCardSheet(DECK[+cb.dataset.card], cb.dataset.rev === '1'); return; }
    const sg = e.target.closest('[data-sign]');
    if (sg) { haptic(); openSignSheet(+sg.dataset.sign); return; }
  });

  // ════════════ ЭКРАН «ЗНАКИ» ════════════
  function renderSigns() {

    $('#signs').innerHTML = `<h1 class="page-title">Архетипы</h1><div class="page-subtitle">Глубинная суть 12 знаков и прогноз на сегодня</div>
      <div class="sign-grid">${SIGNS.map(s => `<button class="sign-tile ${s.id === mine ? 'mine' : ''}" data-sign="${s.id}">

      <div class="card mt16"><div class="card-title">Стихии</div><div class="chips mt8">${ELEMENTS.map((e, i) => `<span class="chip"><span style="width:8px;height:8px;border-radius:50%;background:${e.color};display:inline-block"></span>${e.name}: ${SIGNS.filter(s => s.element === i).map(s => s.name).join(', ')}</span>`).join('')}</div></div>`;
  }

  function openSignSheet(si) {
    const s = SIGNS[si], f = signForecast(si);
    const best = SIGNS.filter(o => { const d0 = Math.abs(o.id - si), d = Math.min(d0, 12 - d0); return d === 4 || d === 2; });
    const hard = SIGNS.filter(o => { const d0 = Math.abs(o.id - si), d = Math.min(d0, 12 - d0); return d === 3; });
    openSheet(`<div class="center"><div class="big-glyph">${s.g}</div><h2 style="font-size:32px">${s.name}</h2><div class="muted small">${s.dates}</div>
      <div class="chips mt12" style="justify-content:center"><span class="chip gold">${ELEMENTS[s.element].name}</span><span class="chip">${QUALITIES[s.quality]}</span><span class="chip">${s.polarity}</span><span class="chip">Управитель: ${s.ruler}</span></div></div>
      <div class="card mt16"><div class="eyebrow">Сегодня, ${fmtDate(new Date())}</div>
        <div class="bars mt12">${bar('Любовь', f.sc.love)}${bar('Работа', f.sc.work)}${bar('Энергия', f.sc.energy)}${bar('Удача', f.sc.luck)}</div>
        <div class="prose mt12">${f.parts.map(p => `<p>${p}</p>`).join('')}</div></div>
      <div class="prose">${s.desc}</div>
      <div class="chips mt12">${s.strengths.map(x => `<span class="chip">${x}</span>`).join('')}</div>
      <div class="section-t">♡ В любви</div><div class="prose">${s.love}</div>
      <div class="section-t">◆ Карьера и призвание</div><div class="prose">${s.career}</div>

  function wheelSVG(N) {

      for (let t = 0; t < 30; t += 5) { if (!t) continue; const [a1, b1] = P(i * 30 + t, R1), [a2, b2] = P(i * 30 + t, R1 - 4); g += `<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" stroke="rgba(216,178,88,.2)"/>`; }

    const keys = Astro.PLANET_KEYS;
    for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) {

    for (let it = 0; it < 30; it++) for (let i = 0; i < pl.length; i++) {
      const a = pl[i], b = pl[(i + 1) % pl.length]; let gap = Astro.norm(b.d - a.d);
      if (gap < 10 && pl.length > 1) { const push = (10 - gap) / 2; a.d -= push; b.d += push; }
    }
    for (const p of pl) {
      const [tx1, ty1] = P(p.lon, R1), [tx2, ty2] = P(p.lon, R1 - 7), [lx, ly] = P(p.d, R1 - 9), [px, py] = P(p.d, R1 - 22), [dx, dy] = P(p.d, R1 - 37);
      g += `<line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#F0D48C" stroke-width="1.4"/><line x1="${tx2}" y1="${ty2}" x2="${lx}" y2="${ly}" stroke="rgba(240,212,140,.3)"/>`;
      g += `<text x="${px}" y="${py}" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#F0D48C">${PLANETS[p.k].g}</text>`;
      g += `<text x="${dx}" y="${dy}" text-anchor="middle" dominant-baseline="central" font-size="8" fill="rgba(255,255,255,.5)">${Math.floor(p.lon % 30)}°</text>`;
    }
    if (N.asc != null) {
      const [ax, ay] = P(N.asc, R0 + 2), [ax2, ay2] = P(N.asc, R3);
      g += `<line x1="${ax}" y1="${ay}" x2="${ax2}" y2="${ay2}" stroke="#D8B258" stroke-width="1.6"/><text x="${ax - 2}" y="${ay - 6}" font-size="9" fill="#D8B258" text-anchor="end" font-weight="600">ASC</text>`;
      const [mx, my] = P(N.mc, R0 + 2), [mx2, my2] = P(N.mc, R3);
      g += `<line x1="${mx}" y1="${my}" x2="${mx2}" y2="${my2}" stroke="#D8B258" stroke-width="1.2" stroke-dasharray="3 3"/><text x="${mx}" y="${my - 5}" font-size="9" fill="#D8B258" text-anchor="middle" font-weight="600">MC</text>`;
    }
    return `<svg viewBox="-30 -18 420 396" font-family="Inter, sans-serif">${g}</svg>`;
  }

  function renderForm() {
    const p = profile || { name: tgName, date: '', time: '', timeKnown: true, city: 0, tz: 3 };
    const tzs = []; for (let t = -12; t <= 14; t += 0.5) tzs.push(t); [5.75, 12.75].forEach(t => tzs.push(t)); tzs.sort((a, b) => a - b);
    const tzLabel = t => `UTC${t >= 0 ? '+' : '−'}${Math.floor(Math.abs(t))}${Math.abs(t) % 1 ? ':' + pad(Math.round((Math.abs(t) % 1) * 60)) : ''}`;
    $('#me').innerHTML = `<h1 class="page-title">${profile ? 'Профиль' : 'Ваша карта'}</h1><div class="page-subtitle">Данные рождения для точного расчёта</div>
      <div class="card">
        <div class="field"><label>Имя (для нумерологии — как в документах)</label><input class="input" id="f-name" value="${esc(p.name || '')}" placeholder="Например, Анна"></div>
        <div class="field"><label>Дата рождения</label><input class="input" type="date" id="f-date" value="${p.date || ''}" min="1900-01-01" max="2100-12-31"></div>
        <div class="field"><label>Время рождения</label><input class="input" type="time" id="f-time" value="${p.time || '12:00'}"></div>
        <label class="check"><input type="checkbox" id="f-notime" ${p.timeKnown === false ? 'checked' : ''}> Не знаю точного времени</label>
        <div class="field"><label>Город рождения</label><select class="select" id="f-city">${CITIES.map((ct, i) => `<option value="${i}" ${p.city === i ? 'selected' : ''}>${ct[0]}</option>`).join('')}<option value="-1" ${p.city === -1 ? 'selected' : ''}>Другой — ввести координаты</option></select></div>
        <div class="row2" id="f-coords" style="${p.city === -1 ? '' : 'display:none'}"><div class="field"><label>Широта (N+, S−)</label><input class="input" id="f-lat" inputmode="decimal" value="${p.city === -1 ? p.lat : ''}" placeholder="55.75"></div><div class="field"><label>Долгота (E+, W−)</label><input class="input" id="f-lon" inputmode="decimal" value="${p.city === -1 ? p.lon : ''}" placeholder="37.62"></div></div>
        <div class="field"><label>Часовой пояс в момент рождения</label><select class="select" id="f-tz">${tzs.map(t => `<option value="${t}" ${p.tz === t ? 'selected' : ''}>${tzLabel(t)}</option>`).join('')}</select></div>
        <div class="notice" style="margin-bottom:14px">Пояс подставляется по городу автоматически. Если вы родились летом в годы, когда действовало летнее время (в СССР/России — 1981–2010), добавьте +1 час.</div>
        <button class="btn btn-primary" id="f-save">Рассчитать натальную карту</button>
        ${profile ? '<button class="btn btn-ghost mt8" style="width:100%" id="f-cancel">Отмена</button>' : ''}
      </div>
      ${!profile ? '<p class="center dim small">Данные хранятся только на вашем устройстве и в облаке Telegram.</p>' : ''}`;
    const city = $('#f-city'), tz = $('#f-tz');
    city.addEventListener('change', () => { const v = +city.value; $('#f-coords').style.display = v === -1 ? '' : 'none'; if (v >= 0) tz.value = CITIES[v][3]; });
    $('#f-notime').addEventListener('change', e => $('#f-time').disabled = e.target.checked);
    $('#f-time').disabled = $('#f-notime').checked;
    $('#f-cancel')?.addEventListener('click', () => { editing = false; renderMe(); });
    $('#f-save').addEventListener('click', () => {
      const date = $('#f-date').value;
      if (!date || +date.slice(0, 4) < 1900 || +date.slice(0, 4) > 2100) { toast('Укажите дату рождения'); notify('error'); return; }
      const ci = +city.value; let lat, lon;
      if (ci >= 0) { lat = CITIES[ci][1]; lon = CITIES[ci][2]; }
      else {
        lat = parseFloat($('#f-lat').value.replace(',', '.')); lon = parseFloat($('#f-lon').value.replace(',', '.'));
        if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 66 || Math.abs(lon) > 180) { toast('Проверьте координаты (широта до ±66°)'); notify('error'); return; }
      }
      const timeKnown = !$('#f-notime').checked;
      profile = { name: $('#f-name').value.trim(), date, time: timeKnown ? ($('#f-time').value || '12:00') : '12:00', timeKnown, city: ci, lat, lon, tz: +tz.value };
      store.set('lumina_profile', profile); computeNatal(); editing = false;
      notify('success'); toast('Натальная карта рассчитана ✨');
      renderAll(); goTab('me');
    });
  }

  function renderAll() { renderHome(); renderSigns(); renderTarot(); renderMatch(); renderMe(); }

  // ── старт ──
  drawStars(); addEventListener('resize', drawStars);
  renderAll();
  goTab(profile ? 'home' : 'home');
  // подтянуть профиль из облака Telegram, если локально пусто
  try {
    if (!profile && tg?.isVersionAtLeast?.('6.9') && tg.initData) {
      tg.CloudStorage.getItem('lumina_profile', (err, val) => {
        if (!err && val) { try { profile = JSON.parse(val); localStorage.setItem('lumina_profile', val); computeNatal(); renderAll(); } catch (e) {} }
      });
    }
  } catch (e) {}
  // обновить «Эфир», если приложение открыто через полночь
  let lastDay = dateKey(new Date());
  document.addEventListener('visibilitychange', () => { if (!document.hidden && dateKey(new Date()) !== lastDay) { lastDay = dateKey(new Date()); renderHome(); } });
})();

</script>
</body>
</html>
