<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1">
<title>Lumina App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Базовый сброс и структурный CSS */
  :root {
    --bg: #0a0a0a; --surface: #141414; --text: #f0f0f0; --accent: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
  
  /* Экраны */
  .screen { display: none; padding: 20px; animation: fade 0.3s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  
  /* Нижнее меню (Tab Bar) */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 65px; background: var(--surface);
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }
  .tab-btn {
    background: none; border: none; color: #666;
    font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; transition: color 0.2s; width: 33%;
  }
  .tab-btn.active { color: var(--accent); }
  .tab-icon { font-size: 20px; }
  
  /* Карточки-заглушки для разметки */
  .card { background: var(--surface); padding: 20px; border-radius: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sign-card { background: var(--surface); padding: 15px; text-align: center; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
</style>
</head>
<body>

  <!-- Экран 1: Личный прогноз -->
  <section id="tab-home" class="screen active">
    <div class="card">
      <h1 id="user-sign" style="font-size: 24px; margin-bottom: 8px;">Твой прогноз</h1>
      <p style="color: #999; font-size: 14px; line-height: 1.5;">Здесь будет выводиться персональный текст на сегодня, загруженный из базы данных бота.</p>
    </div>
  </section>

  <!-- Экран 2: Все знаки -->
  <section id="tab-catalog" class="screen">
    <h2 style="margin-bottom: 16px;">Все знаки</h2>
    <div class="grid">
      <div class="sign-card">♈ Овен</div>
      <div class="sign-card">♉ Телец</div>
      <div class="sign-card">♊ Близнецы</div>
      <div class="sign-card">♋ Рак</div>
      <!-- Остальные знаки добавишь по аналогии -->
    </div>
  </section>

  <!-- Экран 3: Сервисы (Монетизация) -->
  <section id="tab-services" class="screen">
    <div class="card" style="border-color: rgba(255,215,0,0.3);">
      <h2>Совместимость</h2>
      <p style="margin: 10px 0; font-size: 14px; color: #ccc;">Глубинный разбор вашей пары.</p>
      <button style="width: 100%; padding: 12px; border-radius: 8px; background: #fff; color: #000; font-weight: bold; border: none;">Открыть за 150 ⭐️</button>
    </div>
  </section>

  <!-- Навигация -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-target="tab-home">
      <span class="tab-icon">✨</span>
      <span>Прогноз</span>
    </button>
    <button class="tab-btn" data-target="tab-catalog">
      <span class="tab-icon">🌌</span>
      <span>Знаки</span>
    </button>
    <button class="tab-btn" data-target="tab-services">
      <span class="tab-icon">🔮</span>
      <span>Сервисы</span>
    </button>
  </nav>

<script>
  // Инициализация Telegram
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0a0a'); }

  // Парсинг знака из URL
  const params = new URLSearchParams(window.location.search);
  const signParam = params.get('sign');
  if (signParam) document.getElementById('user-sign').innerText = signParam;

  // Логика роутинга (переключения вкладок)
  const tabBtns = document.querySelectorAll('.tab-btn');
  const screens = document.querySelectorAll('.screen');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      // Легкая вибрация при клике
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      // Убираем класс active у всех кнопок и экранов
      tabBtns.forEach(b => b.classList.remove('active'));
      screens.forEach(s => s.classList.remove('active'));

      // Добавляем класс active нажатой кнопке и нужному экрану
      btn.classList.add('active');
      const targetId = btn.getAttribute('data-target');
      document.getElementById(targetId).classList.add('active');
      
      // Прокручиваем страницу наверх при смене вкладки
      window.scrollTo(0, 0);
    });
  });
</script>
</body>
</html>
